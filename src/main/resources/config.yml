# CE pack ID to optimize. Its native hosting type and settings are left unchanged.
pack: default

# Relative to this plugin's data directory, or an absolute shared directory.
# Existing installations must point this to their existing publication state.
namespace-state-directory: state

# Legacy cepackoptimizer:slim options, not used by protected_prefix_zip.
flatten-exact-version-overlays: true
# Add globs for externally addressed resources before using the legacy slimmer.
keep: []
